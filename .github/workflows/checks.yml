name: CyberData checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: /tmp/cyberdata-test.sqlite
      ADMIN_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate Railway configuration
        run: python -c "import json; d=json.load(open('railway.json')); assert d['deploy']['healthcheckPath']=='/health'; assert d['deploy']['startCommand']"
      - name: Compile Python
        run: python -m compileall -q app.py db.py storage.py transfer.py
      - name: SQLite and Flask smoke tests
        run: |
          python - <<'PY'
          import db
          db.init_db()
          db.create_job("test-job", "https://drive.google.com/file/d/demo/view", "smoke.json")
          assert db.get_job("test-job")["status"] == "queued"
          db.save_part("test-job", 1, '"etag"', 5)
          assert db.get_parts("test-job")[0]["size"] == 5
          db.delete_parts_not_in("test-job", [])
          assert db.get_parts("test-job") == []
          db.update("test-job", status="running", progress=50)
          assert db.get_job("test-job")["progress"] == 50
          from app import app
          client = app.test_client()
          assert client.get("/health").status_code == 200
          assert client.get("/").status_code == 200
          assert client.post("/api/transfer/start", json={}).status_code == 401
          print("All smoke tests passed")
          PY
